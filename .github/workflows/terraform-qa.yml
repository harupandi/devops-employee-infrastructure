name: Promote to QA

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit to promote"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VERSION: "1.16.0"
  TF_VAR_location: ${{ vars.LOCATION}}
  TF_VAR_environment: qa
  TF_VAR_pod_cidr: ${{ vars.POD_CIDR}}
  TF_VAR_service_cidr: ${{ vars.SERVICE_CIDR}}
  TF_VAR_dns_service_ip: ${{ vars.DNS_SERVICE_IP}}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}

